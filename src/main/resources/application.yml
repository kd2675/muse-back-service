spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:muse-back-service/.env[.properties]
  application:
    name: muse-back-service
  profiles:
    active: local
    group:
      local: local
      test: test
      dev: dev
      prod: prod
  devtools:
    livereload:
      enabled: false
    restart:
      enabled: false
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: full
    discovery:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          fetch_size: 50
  servlet:
    multipart:
      maxFileSize: 100MB
      maxRequestSize: 100MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      FAIL_ON_EMPTY_BEANS: false
  data:
    jpa:
      repositories:
        enabled: false

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    registerWithEureka: true
    fetchRegistry: true
  instance:
    preferIpAddress: true
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
    metrics:
      enabled: true
  health:
    defaults:
      enabled: true
  # Micrometer 메트릭 설정
  metrics:
    enable:
      jvm: true
      system: true
      web: true
      tomcat: true
    distribution:
      percentiles-histogram:
        http.server.requests: true

integration:
  image:
    base-url: ${IMAGE_BACK_BASE_URL:http://localhost:8081}
    internal-token: ${ATTACHMENT_INTERNAL_TOKEN:local-semo-attachment-token}

muse:
  payment:
    test-credit-enabled: false
    toss:
      enabled: ${MUSE_TOSS_ENABLED:false}
      client-key: ${MUSE_TOSS_CLIENT_KEY:}
      secret-key: ${MUSE_TOSS_SECRET_KEY:}
      api-base-url: ${MUSE_TOSS_API_BASE_URL:https://api.tosspayments.com}
