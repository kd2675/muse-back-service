server:
  port: 20280

spring:
  config:
    activate:
      on-profile: local
  cloud:
    config:
      enabled: false

muse:
  cors:
    allowed-origins: ${MUSE_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

integration:
  image:
    cleanup-enabled: ${MUSE_IMAGE_CLEANUP_ENABLED:false}

database:
  datasource:
    pub:
      master:
        url: jdbc:mysql://kimd0.iptime.org:23306/MUSE?zeroDateTimeBehavior=convertToNull&useLegacyDatetimeCode=false&serverTimezone=Asia/Seoul&noAccessToProcedureBodies=true&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=30000&tcpKeepAlive=true
        username: ${MUSE_DB_USERNAME}
        password: ${MUSE_DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
        maximum-pool-size: 8
        connection-timeout: 30000
        maxLifetime: 1800000
      slave1:
        url: jdbc:mysql://kimd0.iptime.org:23306/MUSE?zeroDateTimeBehavior=convertToNull&useLegacyDatetimeCode=false&serverTimezone=Asia/Seoul&noAccessToProcedureBodies=true&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=30000&tcpKeepAlive=true
        username: ${MUSE_DB_USERNAME}
        password: ${MUSE_DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
        maximum-pool-size: 8
        connection-timeout: 30000
        maxLifetime: 1800000
